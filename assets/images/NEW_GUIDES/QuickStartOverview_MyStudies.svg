<svg xmlns="http://www.w3.org/2000/svg" width="1258" height="334" viewBox="0 0 1258 334" role="img" aria-labelledby="title desc">
  <title id="title">My Studies page with Create New Study button</title>
  <desc id="desc">MetaboLights announcement banner above the My Studies page, with an arrow pointing to the Create New Study button.</desc>
  <rect width="1258" height="334" fill="#f4f4f4"/>
  <rect x="8.5" y="13.5" width="1235" height="136" fill="#f6fbfe" stroke="#c9e3ff"/>
  <text x="38" y="58" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#00558b">We're excited to share the new MetaboLights website, released on 14 July 2026, featuring a refreshed design and an improved user</text>
  <text x="38" y="87" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#00558b">experience to make exploring metabolomics data easier than ever. The MetaboLights Editor and dataset submission processes remain</text>
  <text x="38" y="116" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#00558b">unchanged.</text>
  <circle cx="1203" cy="50" r="12" fill="#c9ced1"/>
  <path d="m1199 46 8 8m0-8-8 8" stroke="#fff" stroke-width="2"/>
  <rect x="8.5" y="161.5" width="1235" height="172" fill="#fff" stroke="#d5d5d5"/>
  <path d="M9 231h1234M9 283h1234" stroke="#d5d5d5"/>
  <g fill="#32b8c0">
    <rect x="36" y="196" width="4" height="13"/><rect x="42" y="188" width="4" height="21"/>
    <rect x="48" y="183" width="4" height="26"/><rect x="54" y="190" width="4" height="19"/>
    <rect x="60" y="199" width="4" height="10"/>
  </g>
  <text x="81" y="207" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#333">My Studies -</text>
  <rect x="216" y="179" width="319" height="37" fill="#ededed"/>
  <text x="240" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#222">submitter@email.com</text>
  <path d="M982 199h69" stroke="#0758ff" stroke-width="3"/>
  <path d="m1047 191 16 8-16 8Z" fill="#0758ff"/>
