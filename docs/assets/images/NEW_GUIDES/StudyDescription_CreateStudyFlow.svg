  <text x="798" y="169" font-family="Arial, sans-serif" font-size="9" fill="#555">Quick Start Guide</text><text x="798" y="187" font-family="Arial, sans-serif" font-size="6" fill="#777">Submission Checklist</text>
  <rect x="796" y="195" width="224" height="15" fill="#eaf8f4"/><text x="806" y="205" font-family="Arial, sans-serif" font-size="6" fill="#247064">Tip</text>
  <text x="798" y="223" font-family="Arial, sans-serif" font-size="6" fill="#555">Before submission, make sure you have prepared your metadata and data files.</text>
  <g font-family="Arial, sans-serif" font-size="5" fill="#444"><text x="804" y="239">• Create a MetaboLights account and begin a new study.</text><text x="804" y="252">• Prepare study details, protocols, samples and assay information.</text><text x="804" y="265">• Organize raw and derived data files before uploading.</text><text x="804" y="278">• Ensure all file names follow the required naming conventions.</text><text x="804" y="291">• Upload files and synchronize metadata when ready.</text><text x="804" y="304">• Validate your study and resolve any errors.</text></g>
  <rect x="4.5" y="104.5" width="187" height="297" fill="#fff" stroke="#85ad1b" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="6" fill="#333"><text x="22" y="119">First name *</text><rect x="22" y="123" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="25" y="132">Noemi</text><text x="22" y="151">Last name *</text><rect x="22" y="155" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="25" y="164">Tejera</text><text x="22" y="183">Affiliation *</text><rect x="22" y="187" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="25" y="196">EMBL-EBI</text><text x="22" y="215">Affiliation ROR ID</text><rect x="22" y="219" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="22" y="247">Affiliation Address</text><rect x="22" y="251" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="22" y="279">Affiliation URL *</text><rect x="22" y="283" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="25" y="292">https://www.ebi.ac.uk/</text><text x="22" y="311">Country *</text><rect x="22" y="315" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="25" y="324">United Kingdom</text><text x="22" y="343">ORCID</text><rect x="22" y="347" width="155" height="13" fill="#fff" stroke="#ccc"/><text x="22" y="375">Global Identity</text><rect x="22" y="379" width="155" height="13" fill="#fff" stroke="#ccc"/></g>
