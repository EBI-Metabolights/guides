  <rect x="385" y="68" width="517" height="19" fill="#e4f3fc"/><text x="441" y="81" font-family="Arial, sans-serif" font-size="6" fill="#39739a">Due to scheduled maintenance from Monday 12th October 2026 to Thursday 15th October 2026, MetaboLights services will be temporarily unavailable.</text>
